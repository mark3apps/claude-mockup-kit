<canvas id="sky" aria-label="Every item at true scale. Drag to pan, scroll or pinch to zoom, click one to resize it."></canvas><div class="stop"><div class="sbrand"><h1>SIZE LINEUP</h1><p>EDIT: what is on the page and at what scale. Drag to pan, scroll or pinch to zoom, click one to resize it, shift-click to pick several.</p></div><div role="group" aria-label="View" class="szoom"><button id="zout" type="button" aria-label="Zoom out" class="kbtn">−</button><output id="zread"></output><button id="zin" type="button" aria-label="Zoom in" class="kbtn">+</button><button id="zfit" type="button" class="kbtn">FIT ALL</button><button id="znames" type="button" aria-pressed="true" class="tog">Names</button></div></div><section id="sdock" data-item="" data-name="" data-asks="more" hidden aria-live="polite" class="sfloat"><div class="shead"><b class="ilabel"></b><div><h2 id="sname"></h2><div id="suse" class="suse"></div></div></div><div class="srow"><input id="sk" type="range" min="-200" max="200" step="1" value="0" aria-label="Size, ×¼ to ×4"><input id="slen" type="number" min="0.1" step="0.1" aria-label="Length in world units"></div><div id="snums"></div><div id="smrow" class="srow"><button id="ssame" type="button" hidden class="kbtn"></button><button id="smatch" type="button" hidden class="kbtn"></button><button id="smulti" type="button" aria-pressed="false" class="tog">Add on tap</button></div><div class="srow"><button id="sreset" type="button" class="kbtn">RESET</button><button id="shideit" type="button" class="kbtn">HIDE ITEM</button><span class="kasks"><button type="button" data-ask="more" class="kbtn kask">Tell me more</button><span class="ok"></span></span><button id="sclose" type="button" style="margin-left:auto" class="kbtn">CLOSE</button></div></section><div class="picks sfloat"><div class="srow"><h3>SIZE CHANGES</h3><button id="sfold" type="button" aria-expanded="true" class="kbtn shide">HIDE</button></div><pre></pre><div class="row"><button data-send class="kbtn send">SEND SIZES</button><button data-notes aria-pressed="true" class="tog">Voice notes follow in chat</button><button data-copy class="kbtn gold">COPY</button><button id="sundo" type="button" class="kbtn">UNDO ALL</button><span class="ok"></span></div></div><script type="application/json" id="sizes">@@FILE:sprites.json@@</script>
